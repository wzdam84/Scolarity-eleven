
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8d5bd1">
<title>Scolarity Eleven</title>
<style>
:root{--purple:#8d5bd1;--deep:#6840a7;--pale:#f2eaff;--lav:#e6d5ff;--ink:#30283b;--muted:#756d80;--white:#fff;--green:#27865c;--red:#c84d62;--gold:#c29222}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#b68de9 0%,#8e62cf 55%,#7048b4 100%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:0}#app{max-width:760px;margin:auto;min-height:100vh;padding:18px 15px 40px}
.top{display:flex;align-items:center;justify-content:space-between;color:white;margin:4px 2px 18px}.brand{font-weight:950;font-size:clamp(25px,6vw,39px);letter-spacing:-1.5px}.brand span{color:#ffe18a}.round{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--deep);font-size:24px;font-weight:900}
.panel{background:#fff;border-radius:28px;padding:24px;margin:15px 0;box-shadow:0 10px 30px #4c287333}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(29px,7vw,42px);line-height:1.08;margin-bottom:12px}h2{font-size:25px;margin-bottom:10px}p{line-height:1.5}.sub{color:var(--muted);font-size:17px}.eyebrow{font-size:13px;letter-spacing:1.5px;font-weight:900;color:var(--purple);text-transform:uppercase}
.bigbtn{display:block;width:100%;padding:19px 18px;border-radius:18px;background:var(--purple);color:white;font-weight:900;font-size:20px;margin-top:13px;box-shadow:0 5px 0 var(--deep)}
.bigbtn.secondary{background:white;color:var(--deep);border:2px solid var(--lav);box-shadow:none}.choice{display:block;width:100%;text-align:left;padding:19px;border:2px solid #ded4e9;background:#fff;border-radius:19px;margin:13px 0;color:var(--ink);transition:.15s}.choice:active{transform:scale(.99)}.choice strong{display:block;font-size:20px;margin-bottom:5px}.choice span{display:block;color:var(--muted);font-size:15px;line-height:1.4}.choice.selected{border-color:var(--purple);background:#f8f2ff;box-shadow:0 0 0 3px #8d5bd122}
.progress{height:9px;border-radius:20px;background:#eee5f8;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;background:var(--purple);border-radius:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.stat{background:#f7f2fc;border-radius:17px;padding:13px}.stat .label{font-size:13px;color:var(--muted);font-weight:750}.stat b{display:block;font-size:26px;margin-top:2px}.stat small{font-size:12px;color:var(--muted)}
.profile{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.avatar{width:68px;height:68px;border-radius:22px;background:var(--pale);display:grid;place-items:center;font-size:38px;float:left;margin-right:13px}.profile h2{margin:3px 0}.year{background:linear-gradient(90deg,#9160d4,#c69ae9);color:white;font-weight:900;padding:14px 18px;border-radius:0 0 20px 20px;margin:-24px -24px 18px}
.event{border:3px solid var(--purple)}.eventhead{text-align:center;font-weight:950;color:var(--deep);letter-spacing:.5px;margin-bottom:14px}.story{font-size:21px;line-height:1.5;margin-bottom:20px}.tag{display:inline-block;padding:7px 12px;border-radius:30px;background:#f0e7fb;color:var(--deep);font-weight:850;font-size:13px;margin-bottom:10px}.result{padding:16px;border-radius:16px;background:#f3fbf6;color:#216c4c;font-weight:800;margin:15px 0}.result.bad{background:#fff0f1;color:#a53e50}.muted{text-align:center;color:#eee;font-size:13px;margin-top:20px}
.homehero{background:linear-gradient(150deg,#4d326e,#211b35);color:white;min-height:310px;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;border-radius:28px;overflow:hidden;position:relative}.homehero:before{content:"🎓";position:absolute;font-size:130px;right:22px;top:18px;opacity:.22}.homehero p{font-size:18px;color:#eee4ff;max-width:490px}
.notice{background:#fff8e7;border-radius:14px;padding:13px;color:#7b5a14;font-size:14px;margin-top:14px}
.footer{text-align:center;color:#f4eaff;font-size:12px;padding:12px}
@media(min-width:600px){#app{padding:24px}.panel{padding:30px}.year{margin:-30px -30px 20px}.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const names=["Lina","Adam","Inès","Noah","Yanis","Jade","Sofiane","Léa","Nassim","Sarah","Lucas","Maya"];
const surnames=["Moreau","Bernard","Petit","Robert","Richard","Durand","Garcia","Marchand","Roux","Simon"];
let game=null,step=0,setup={family:null,school:null};
const events=[
{type:"CONTRÔLE SURPRISE",age:14,text:"Le professeur annonce un contrôle surprise en mathématiques. Tu n'as presque pas révisé, mais tu peux encore choisir comment réagir.",choices:[
["🧠 Tenter de résoudre les exercices calmement","Tu prends ton temps et tu fais de ton mieux.",{avg:2,energy:-5}],
["🤝 Demander discrètement de l'aide à ton voisin","Tu comprends quelques questions, mais le professeur te surveille.",{avg:1,pop:1,energy:-2}],
["🎲 Répondre au hasard et rendre vite","Tu sors rapidement. Le résultat risque d'être décevant.",{avg:-2,energy:2}]]},
{type:"VIE AU COLLÈGE",age:14,text:"À la récréation, un groupe t'invite à rejoindre leur table. Tu ne connais presque personne.",choices:[
["😊 Aller leur parler naturellement","La discussion se passe mieux que prévu.",{pop:5,energy:-2}],
["📱 Rester avec ton téléphone","Tu profites d'un moment tranquille.",{energy:3}],
["👋 Retrouver tes anciens amis","Tu passes un bon moment avec tes proches.",{pop:2,energy:1}]]},
{type:"DEVOIRS",age:15,text:"Tu as plusieurs devoirs à rendre demain. Tes amis te proposent une sortie ce soir.",choices:[
["📚 Rester travailler sérieusement","Tu termines tes devoirs et tu arrives préparé en classe.",{avg:3,energy:-8}],
["🎉 Sortir avec tes amis","Tu profites de la soirée, mais tu devras t'organiser demain.",{pop:5,money:-8,energy:-6}],
["⚖️ Faire une partie des devoirs puis sortir","Tu trouves un compromis, même si tout n'est pas parfait.",{avg:1,pop:2,money:-5,energy:-3}]]},
{type:"ORIENTATION",age:15,text:"Le conseil de classe approche. Tes résultats sont corrects et on te demande de réfléchir à ton orientation.",choices:[
["🎯 Viser une filière ambitieuse","Tu te fixes un objectif élevé et tu devras t'accrocher.",{avg:1,energy:-3}],
["🧭 Choisir une voie qui te correspond","Tu privilégies une orientation qui t'intéresse vraiment.",{pop:1,energy:2}],
["😶 Ne pas encore te décider","Tu préfères attendre d'en savoir plus.",{avg:-1}]]},
{type:"EXAMEN",age:16,text:"Les examens approchent. Tu as quelques jours pour te préparer et tu sais que cette période comptera beaucoup.",choices:[
["🔥 Réviser chaque soir","Tes efforts paient, mais tu termines épuisé.",{avg:5,energy:-14}],
["🗓️ Organiser un planning équilibré","Tu avances régulièrement sans trop te fatiguer.",{avg:3,energy:-7}],
["🎮 Faire une pause et improviser","Tu décompresses, mais tu prends un risque pour tes résultats.",{avg:-3,pop:1,energy:5}]]},
{type:"RÉPUTATION",age:16,text:"Une vidéo de toi lors d'un exposé circule dans le groupe de classe. Certains se moquent, d'autres trouvent que tu assures.",choices:[
["😎 Assumer et en rire","Ton assurance impressionne plusieurs élèves.",{pop:5}],
["💬 Répondre calmement aux moqueries","Tu évites que la situation dégénère.",{pop:2,energy:-2}],
["🙈 Ne pas réagir","L'histoire finit par retomber toute seule.",{energy:1}]]},
{type:"PETIT BOULOT",age:17,text:"Un voisin te propose quelques heures de baby-sitting le week-end. Tu pourrais gagner un peu d'argent.",choices:[
["💶 Accepter la mission","Tu gagnes de l'argent et tu apprends à être responsable.",{money:25,energy:-7}],
["📖 Refuser pour te concentrer sur les cours","Tu gardes ton temps libre pour tes révisions.",{avg:2,energy:2}],
["🤔 Accepter seulement quelques heures","Tu gagnes un peu d'argent sans trop charger ton week-end.",{money:12,energy:-3}]]},
{type:"GRAND CHOIX",age:17,text:"Une journée portes ouvertes présente plusieurs établissements réputés. Tu dois décider comment préparer la suite.",choices:[
["🏛️ Candidater à une grande école","Tu vises haut. Il faudra un dossier solide.",{avg:2,energy:-4}],
["🌱 Choisir un établissement proche","Tu privilégies un cadre qui te convient.",{pop:2,money:3}],
["🚀 Multiplier les candidatures","Tu augmentes tes possibilités, mais la préparation prend du temps.",{avg:1,energy:-6}]]}
];
function clamp(n,min=0,max=100){return Math.max(min,Math.min(max,n))}
function header(){return `<header class="top"><button class="round" onclick="home()">⌂</button><div class="brand">Scolarity <span>Eleven</span></div><div style="width:52px"></div></header>`}
function renderHome(){document.body.style.background="linear-gradient(145deg,#b68de9,#8e62cf 55%,#7048b4)";$("#app").innerHTML=header()+`<section class="homehero"><div class="eyebrow" style="color:#d9c1ff">UNE VIE, MILLE POSSIBILITÉS</div><h1>Écris ton histoire.</h1><p>De tes premières années au collège jusqu'à tes grands choix d'avenir, chaque décision compte.</p>${game?`<button class="bigbtn" onclick="dashboard()">▶ Reprendre la carrière · ${game.name}</button>`:""}<button class="bigbtn secondary" onclick="startNew()">＋ Nouvelle carrière</button></section><section class="panel"><h2>🎯 Ton objectif</h2><p class="sub">Construire ton avenir, réussir tes études, te faire des amis et gérer ton énergie et ton argent. Tes choix écrivent ton parcours.</p></section><div class="footer">SCOLARITY ELEVEN · Une nouvelle histoire commence avec toi</div>`}
function home(){renderHome()}
function startNew(){game=null;setup={family:null,school:null};step=0;renderSetup()}
function renderSetup(){const titles=["Ton foyer","Ton établissement"];let html=header()+`<section class="panel"><div class="eyebrow">NOUVELLE CARRIÈRE · ÉTAPE ${step+1}/2</div><div class="progress"><i style="width:${(step+1)*50}%"></i></div><h1>${titles[step]}</h1><p class="sub">${step===0?"Le cadre dans lequel tu grandis peut changer ton départ.":"Choisis l'établissement où ton histoire va commencer."}</p>`;
if(step===0){html+=choice("🏡 Famille modeste","Un foyer simple, beaucoup de débrouillardise.", "modeste")+choice("💎 Famille aisée","Plus de moyens pour tes projets et tes études.","aisee")+choice("🌿 Famille populaire","Tu apprends à te battre pour saisir les occasions.","populaire")}
else{html+=choice("🏫 Petit établissement","Un cadre tranquille où tu peux prendre tes marques.","petit")+choice("📚 Établissement classique","Un parcours équilibré, avec de bonnes possibilités.","classique")+choice("🏛️ Établissement réputé","Un niveau exigeant et de belles opportunités.","repute")+choice("👑 Établissement prestigieux","La barre est haute, la pression aussi.","prestigieux")}
html+=`<button class="bigbtn" onclick="nextSetup()" ${!setup[step===0?"family":"school"]?'disabled style="opacity:.45"':''}>${step===0?"Continuer →":"Commencer ma vie scolaire →"}</button></section>`;$("#app").innerHTML=html}
function choice(title,desc,val){let key=step===0?"family":"school";return `<button class="choice ${setup[key]===val?'selected':''}" onclick="setup.${key}='${val}';renderSetup()"><strong>${title}</strong><span>${desc}</span></button>`}
function nextSetup(){if(step===0){step=1;renderSetup();return}let f=setup.family,s=setup.school;let avg=s==="prestigieux"?65:s==="repute"?62:s==="petit"?58:60;let money=f==="aisee"?80:f==="modeste"?45:30;game={name:names[Math.floor(Math.random()*names.length)]+" "+surnames[Math.floor(Math.random()*surnames.length)],age:14,year:2026,day:1,avg,pop:f==="populaire"?58:45,energy:85,money,family:f,school:s,eventCount:0,history:[]};nextEvent()}
function dashboard(){let g=game;$("#app").innerHTML=header()+`<section class="panel"><div class="profile"><div><div class="avatar">🧑‍🎓</div><div class="eyebrow">ÉLÈVE · ${g.age} ANS</div><h2>${g.name}</h2><div class="sub">${g.school==="prestigieux"?"Établissement prestigieux":g.school==="repute"?"Établissement réputé":g.school==="petit"?"Petit établissement":"Établissement classique"}</div></div><div style="text-align:right"><div class="eyebrow">ANNÉE</div><b style="font-size:27px;color:var(--gold)">${g.year}</b></div></div><div class="stats">
<div class="stat"><div class="label">📚 MOYENNE</div><b>${g.avg.toFixed(1)}/100</b><small>Résultats scolaires</small></div>
<div class="stat"><div class="label">⭐ POPULARITÉ</div><b>${g.pop}/100</b><small>Ta réputation</small></div>
<div class="stat"><div class="label">⚡ ÉNERGIE</div><b>${g.energy}/100</b><small>Ton état général</small></div>
<div class="stat"><div class="label">💶 ARGENT</div><b>${g.money} €</b><small>Argent de poche</small></div></div></section><section class="panel"><div class="eyebrow">TON PARCOURS</div><h2>Une année à construire</h2><p class="sub">Événement ${g.eventCount+1} · Chaque choix peut changer la suite de ton histoire.</p><button class="bigbtn" onclick="nextEvent()">Continuer l'aventure →</button></section><section class="panel"><h2>🏆 Tes objectifs</h2><p class="sub">Obtenir ton diplôme avec une bonne moyenne, garder un bon équilibre et préparer ton avenir.</p><div class="notice">Astuce : les choix scolaires peuvent améliorer ta moyenne, mais certains demandent beaucoup d'énergie.</div></section>`}
function nextEvent(){if(!game)return;let g=game;if(g.eventCount>0&&g.eventCount%3===0){g.age++;g.year++;g.energy=clamp(g.energy+12);g.money+=5;if(g.age>18){ending();return}}let eligible=events.filter(e=>e.age<=g.age);let e=eligible[Math.floor(Math.random()*eligible.length)];g.current=e;renderEvent(e)}
function renderEvent(e){let g=game;let last=g.lastResult?`<div class="result ${g.lastResult.positive?"":"bad"}"><b>Conséquences du choix précédent</b><br>${g.lastResult.lines}</div>`:"";g.lastResult=null;$("#app").innerHTML=header()+`<section class="panel">${last}<div class="profile"><div><div class="avatar">🧑‍🎓</div><div class="eyebrow">${g.age} ANS · ${g.year}</div><h2>${g.name}</h2></div><div style="background:#f1e7fc;color:var(--deep);padding:13px;border-radius:16px;font-weight:950">#${g.eventCount+1}</div></div><div class="stats"><div class="stat"><div class="label">📚 MOYENNE</div><b>${g.avg.toFixed(1)}</b></div><div class="stat"><div class="label">⭐ POPULARITÉ</div><b>${g.pop}</b></div><div class="stat"><div class="label">⚡ ÉNERGIE</div><b>${g.energy}</b></div><div class="stat"><div class="label">💶 ARGENT</div><b>${g.money} €</b></div></div></section><section class="panel event"><div class="eventhead">✦ ${e.type} · ${g.age} ANS ✦</div><p class="story">${e.text}</p><div class="eyebrow">QUE DÉCIDES-TU ?</div>${e.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><strong>${c[0]}</strong><span>${c[1]}</span></button>`).join("")}</section>`}
function choose(i){let g=game,c=g.current.choices[i],d=c[2],lines=[];g.avg=clamp(g.avg+(d.avg||0),0,100);g.pop=clamp(g.pop+(d.pop||0));g.energy=clamp(g.energy+(d.energy||0));g.money=Math.max(0,g.money+(d.money||0));if(d.avg)lines.push(`📚 Moyenne ${d.avg>0?"+":""}${d.avg.toFixed(1)}`);if(d.pop)lines.push(`⭐ Popularité ${d.pop>0?"+":""}${d.pop}`);if(d.energy)lines.push(`⚡ Énergie ${d.energy>0?"+":""}${d.energy}`);if(d.money)lines.push(`💶 Argent ${d.money>0?"+":""}${d.money} €`);if(!lines.length)lines.push("Aucune statistique ne change cette fois.");g.eventCount++;g.history.push({event:g.current.type,choice:c[0],age:g.age});g.lastResult={lines:lines.join("<br>"),positive:(d.avg||0)+(d.pop||0)+(d.energy||0)/4+(d.money||0)/5>=0};nextEvent()}
function ending(){let g=game;let schoolName={prestigieux:"Établissement prestigieux",repute:"Établissement réputé",classique:"Établissement classique",petit:"Petit établissement"}[g.school]||"Établissement";let familyName={aisee:"Famille aisée",modeste:"Famille modeste",populaire:"Famille populaire"}[g.family]||"Famille";let diploma=g.avg>=50;let mention=g.avg>=90?"Félicitations du jury":g.avg>=80?"Mention Très bien":g.avg>=70?"Mention Bien":g.avg>=60?"Mention Assez bien":diploma?"Diplôme obtenu":"Parcours sans diplôme";let badges=[];if(g.avg>=75)badges.push("🧠 Tête de classe");if(g.pop>=75)badges.push("⭐ Star du lycée");if(g.energy>=70)badges.push("⚡ Toujours en forme");if(g.money>=100)badges.push("💶 Bon gestionnaire");if(g.eventCount>=12)badges.push("🏅 Persévérant");if(!badges.length)badges.push("🌱 Première expérience");let style=g.avg>=75?"Le travailleur ambitieux":g.pop>=75?"La personnalité populaire":g.energy>=70?"L'élève équilibré":"Le parcours atypique";let comments=g.avg>=75?"Tes efforts et ta régularité ont marqué ta scolarité.":g.avg>=50?"Tu as connu des hauts et des bas, mais tu as avancé jusqu'au bout.":"Le chemin n'a pas été facile. Cette expérience peut être le début d'un nouveau départ.";let history=g.history.map((h,i)=>`<div class="choice" style="margin:8px 0;padding:13px"><strong>${i+1}. ${h.event} · ${h.age} ans</strong><span>${h.choice}</span></div>`).join("");let badgeHtml=badges.map(b=>`<span class="tag" style="font-size:15px;margin:5px">${b}</span>`).join("");let final=`<section class="panel"><div class="eyebrow">BILAN DE CARRIÈRE · SCOLARITY ELEVEN</div><h1>🎓 ${g.name}</h1><p class="story">${diploma?"Tu arrives au bout de tes études !":"Ton parcours scolaire s'achève aujourd'hui."} Voici le résumé de toutes ces années.</p><div class="result">${diploma?"🏆 ":"📘 "}${mention}</div><h2>📚 Ton parcours</h2><p class="sub">${familyName} · ${schoolName}<br>De 14 à 18 ans · ${g.eventCount} événements vécus</p><h2>📊 Tes statistiques finales</h2><div class="stats"><div class="stat"><div class="label">MOYENNE</div><b>${g.avg.toFixed(1)}/100</b></div><div class="stat"><div class="label">POPULARITÉ</div><b>${g.pop}/100</b></div><div class="stat"><div class="label">ÉNERGIE</div><b>${g.energy}/100</b></div><div class="stat"><div class="label">ARGENT</div><b>${g.money} €</b></div></div><h2 style="margin-top:22px">🏅 Tes badges</h2><div>${badgeHtml}</div><h2 style="margin-top:22px">✨ Ta personnalité</h2><div class="tag">${style}</div><p>${comments}</p><h2>🗂️ Les moments de ta carrière</h2>${history||"<p class='sub'>Aucun événement enregistré.</p>"}<button class="bigbtn" onclick="startNew()">＋ Commencer une nouvelle carrière</button><button class="bigbtn secondary" onclick="home()">Accueil</button></section>`;$("#app").innerHTML=header()+final;game=null}
renderHome();
</script></main></body>
</html>
